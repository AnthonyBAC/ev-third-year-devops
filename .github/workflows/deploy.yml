name: CI/CD - Build, Push & Deploy Backend

on:
  push:
    branches:
      - deploy

jobs:
  # ───────────────────────────────────────────
  # Build y push de las 2 imagenes en paralelo
  # ───────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - context: ./back-Ventas_SpringBoot/Springboot-API-REST
            dockerfile: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
            name: back-ventas
          - context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
            dockerfile: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
            name: back-despachos

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build y push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Deploy a EC2 Backend con docker compose
  # 1) Copia docker-compose.yml + init-db.sql a la instancia
  # 2) Hace docker compose pull + up -d (usa imagenes de Docker Hub)
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Copiar compose + init-db a EC2 (vía bastion frontend)
        uses: appleboy/scp-action@v0.1.7
        with:
          # host = IP PRIVADA del backend; se llega saltando por el bastion
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          # Bastion = frontend (público). El runner entra aquí y salta al backend privado.
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_port: 22
          source: "docker-compose.yml"
          target: "~/app-backend"

      - name: Levantar stack con docker compose (vía bastion frontend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          # Pasa los secrets al shell remoto para que docker compose
          # los sustituya en ${...} dentro del docker-compose.yml
          envs: DOCKER_USERNAME,DB_HOST,MYSQL_USER,MYSQL_PASSWORD
          script: |
            set -eu
            echo "Verificar docker compose v2"
            docker compose version

            cd ~/app-backend

            echo "Pre-cleanup"
            docker container prune -f || true
            docker image prune -f || true
            df -h /

            echo "Pull imagenes publicadas"
            docker compose pull

            echo "Limpiar contenedores heredados del deploy anterior (docker run, sin compose)"
            for c in mysql-db back-ventas back-despachos; do
              proj=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$c" 2>/dev/null || true)
              if [ -n "$(docker ps -aq -f name=^${c}$)" ] && [ -z "$proj" ]; then
                echo "  removiendo contenedor legacy $c"
                docker rm -f "$c" || true
              fi
            done

            echo "Levantar stack"
            docker compose up -d --remove-orphans

            echo "Post-cleanup (imagenes viejas sin uso)"
            docker image prune -af || true
            df -h /

            echo "Estado del stack"
            docker compose ps
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
