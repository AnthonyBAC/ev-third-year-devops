name: CI/CD - Build, Push & Deploy Backend

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 211125593312.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ───────────────────────────────────────────
  # Build y push de las 2 imagenes en paralelo
  # ───────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - context: ./back-Ventas_SpringBoot/Springboot-API-REST
            dockerfile: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
            name: back-ventas
          - context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
            dockerfile: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
            name: back-despachos

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Deploy a EC2 Backend con docker compose
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Copiar compose a EC2 (vía bastion frontend)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_port: 22
          source: "docker-compose.yml"
          target: "~/app-backend"

      - name: Levantar stack con docker compose (vía bastion frontend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,DB_HOST,MYSQL_USER,MYSQL_PASSWORD
          script: |
            set -eu
            echo "Verificar docker compose v2"
            docker compose version

            cd ~/app-backend

            echo "Pre-cleanup"
            docker container prune -f || true
            docker image prune -f || true
            df -h /

            echo "Login en ECR desde la EC2"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin 211125593312.dkr.ecr.us-east-1.amazonaws.com

            echo "Pull imagenes publicadas"
            docker compose pull

            echo "Limpiar contenedores heredados"
            for c in back-ventas back-despachos; do
              proj=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$c" 2>/dev/null || true)
              if [ -n "$(docker ps -aq -f name=^${c}$)" ] && [ -z "$proj" ]; then
                echo "  removiendo contenedor legacy $c"
                docker rm -f "$c" || true
              fi
            done

            echo "Levantar stack"
            docker compose up -d --remove-orphans

            echo "Post-cleanup"
            docker image prune -af || true
            df -h /

            echo "Estado del stack"
            docker compose ps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
