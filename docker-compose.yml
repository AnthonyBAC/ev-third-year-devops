# ─────────────────────────────────────────────────────────────
# Stack backend: SOLO las 2 APIs Spring Boot.
# MySQL vive en su propia EC2 (tier de datos), se accede por ${DB_HOST}.
#
# Uso local (build desde codigo fuente):
#   docker compose up -d --build
#
# Uso en EC2 (imagenes ya publicadas en Docker Hub):
#   docker compose pull && docker compose up -d
#
# Variables requeridas (ver .env.example):
#   DOCKER_USERNAME, DB_HOST, MYSQL_USER, MYSQL_PASSWORD
# ─────────────────────────────────────────────────────────────
services:

  back-ventas:
    image: ${DOCKER_USERNAME}/back-ventas:latest
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: back-ventas
    restart: unless-stopped
    environment:
      DB_ENDPOINT: ${DB_HOST}
      DB_PORT: 3306
      DB_NAME: db_ventas
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/db_ventas?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    ports:
      - "8080:8080"
    # El t3.micro del backend ya NO corre MySQL, asi que las JVM pueden usar mas RAM
    mem_limit: 400m
    memswap_limit: 800m

  back-despachos:
    image: ${DOCKER_USERNAME}/back-despachos:latest
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: back-despachos
    restart: unless-stopped
    environment:
      DB_ENDPOINT: ${DB_HOST}
      DB_PORT: 3306
      DB_NAME: db_despachos
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/db_despachos?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    ports:
      - "8081:8081"
    mem_limit: 400m
    memswap_limit: 800m
